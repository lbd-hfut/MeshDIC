[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "mesh-dic"
version = "0.1.0"
description = "C++ implementation of Mesh-DIC with Python bindings"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "LeeBDa" }]
dependencies = [
    "numpy>=1.21",
    "pyyaml>=6.0",
    "opencv-python>=4.5",
    "scipy>=1.7",
]

[project.optional-dependencies]
mesh = [
    "pygmsh>=7.0",
    "gmsh",
    "meshio",
]
dev = [
    "pytest>=7.0",
    "pytest-benchmark",
]

[tool.scikit-build]
cmake.version = ">=3.15"
wheel.packages = ["src/mesh_dic"]
cmake.args = ["-DCMAKE_BUILD_TYPE=Release"]
