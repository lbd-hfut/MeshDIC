solver:
  subset_radius: 31
  search_radius: 20
  max_iterations: 30
  cutoff_diffnorm: 0.0001
  lambda_reg: 0.000001
  bcoef_border: 3
  alpha: 0.1
  init_nodal: true
  init_subpixel: true
  init_subset_radius: 20
  init_search_radius: 15
  init_local_max_iter: 50
  init_local_tol: 1.0e-6
  init_local_lambda: 1.0e-6
  method: "forward_gn"
  max_iter: 10
  tol: 0.001

images:
  ref: ""
  def: ""
  roi: ""

mesh:
  dir: "./mesh/"
  size: 30.0
  element_type: "Q8"
  # ---- external mesh import (optional) ----
  # Set external_file to a path generated by Abaqus/Gmsh/ANSYS/etc.
  # to skip auto-generation. Supported: .inp .msh .bdf .vtu and more.
  external_file: ""
