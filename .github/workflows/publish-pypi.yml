name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          activate-environment: meshdic-build
          auto-activate-base: false

      - name: Install native build dependencies
        run: |
          conda install -y -n meshdic-build -c conda-forge eigen libopencv cmake ninja

      - name: Install Python build tools
        run: |
          conda run -n meshdic-build python -m pip install --upgrade pip
          conda run -n meshdic-build python -m pip install build twine

      - name: Inspect OpenCV headers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          conda_env="$(conda info --base)/envs/meshdic-build"
          find "${conda_env}/include" -path "*/opencv2/core.hpp" -print | tee /tmp/opencv-headers.txt
          test -s /tmp/opencv-headers.txt

      - name: Inspect OpenCV headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $condaEnv = Join-Path ((conda info --base).Trim()) 'envs\meshdic-build'
          $headers = Get-ChildItem -Path (Join-Path $condaEnv 'Library\include') -Recurse -Filter core.hpp |
            Where-Object { $_.FullName -match 'opencv2' } |
            Select-Object -ExpandProperty FullName
          $headers
          if (-not $headers) { throw 'OpenCV core.hpp not found' }

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          conda_env="$(conda info --base)/envs/meshdic-build"
          conda run -n meshdic-build python -m build --wheel \
            "-Ccmake.define.OpenCV_DIR=${conda_env}" \
            "-Ccmake.define.OpenCV_INCLUDE_DIRS=${conda_env}/include/opencv4" \
            "-Ccmake.define.EIGEN3_INCLUDE_DIR=${conda_env}/include/eigen3"

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $condaEnv = Join-Path ((conda info --base).Trim()) 'envs\meshdic-build'
          conda run -n meshdic-build python -m build --wheel `
            "-Ccmake.define.OpenCV_DIR=$condaEnv\Library" `
            "-Ccmake.define.OpenCV_INCLUDE_DIRS=$condaEnv\Library\include" `
            "-Ccmake.define.EIGEN3_INCLUDE_DIR=$condaEnv\Library\include\eigen3"

      - name: Check wheel
        run: |
          conda run -n meshdic-build python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish distributions to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
